name: Desktop installer

# Builds the Windows installer for TERECO Collect.
#
# It has to run on Windows. The client stores assessments in SQLite through
# better-sqlite3-multiple-ciphers, a native module with no published Windows
# prebuilds, and node-gyp cannot cross-compile from source. A Linux machine can
# stamp an .exe through Wine but cannot produce the .node binary inside it, so
# the only way to get an installer without a Windows workstation is to build it
# on one — which is what this runner is.
#
# Run it from the Actions tab, or push to the branch below.

on:
  workflow_dispatch:
  # On pull requests too: the client is only ever broken in ways that appear
  # when it is packaged and started, which no other check does.
  pull_request:
    paths:
      - 'desktop/**'
      - 'components/**'
      - 'lib/**'
      - 'app/globals.css'
      - '.github/workflows/desktop-installer.yml'
  push:
    branches:
      - main
      - feature/offline-desktop-renderer
    paths:
      - 'desktop/**'
      - 'components/**'
      - 'lib/**'
      - 'app/globals.css'
      - '.github/workflows/desktop-installer.yml'

jobs:
  windows:
    runs-on: windows-latest
    # Needed for the default GITHUB_TOKEN to create a release in the publish
    # step below. Everything before it (build, smoke) needs no permission.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The renderer is built from the repository root because it reuses the web
      # app's React components and shares its node_modules. desktop/renderer/dist
      # is gitignored, so without this the installer would ship no application
      # code at all — the app would install and then have nothing to open.
      - name: Build the renderer
        run: |
          npm ci
          npm run build:renderer

      - name: Verify the bundle exists
        shell: bash
        run: test -f desktop/renderer/dist/index.html

      # postinstall runs electron-rebuild, which compiles the native SQLite
      # module against Electron's ABI. This is the step that cannot happen
      # anywhere but Windows, and the reason this workflow exists.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # electron-updater decides "is there something newer" by comparing
      # semver against the running app. package.json's version never moves by
      # itself, so without this every build would be "1.0.0" forever and no
      # install would ever see an update. run_number only climbs, never
      # resets, so it is monotonic across every run of this workflow — PR and
      # manual runs included — which is all electron-updater requires.
      - name: Set the desktop app version
        working-directory: desktop
        shell: bash
        run: npm pkg set version="1.0.${{ github.run_number }}"

      - name: Build the installer
        working-directory: desktop
        run: npm run dist:win

      # An installer that exists is not an app that starts. This runs the
      # packaged binary and fails if it dies during startup — the only check
      # that catches a native module built for the wrong runtime, or a file
      # left out of the package, before the .exe reaches a lab machine.
      - name: Start the packaged app
        working-directory: desktop
        run: npm run smoke

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: TERECO-Collect-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

      # Publishes a GitHub Release so electron-updater has something to find.
      # Deliberately its own build, after the smoke test above has already
      # proven the app starts — nothing broken ever reaches a release, and
      # nothing publishes for a PR or a push to any branch but main.
      - name: Publish a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win:publish
